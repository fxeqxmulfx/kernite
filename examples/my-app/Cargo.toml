[package]
name = "my-app"
description = "An example user of kernite: kernels written where they are called, held to scalar references bit for bit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kernite-cpu = { workspace = true }
kernite-cuda = { workspace = true }
kernite-macros = { workspace = true }

# Not the workspace's lints: calling a kernel is unsafe, and this crate is where it happens.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
disallowed_types = "deny"
