[package]
name = "my-app"
description = "An example user of kgen: kernels written where they are called, held to scalar references bit for bit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kgen-cuda = { workspace = true }
kgen-macros = { workspace = true }

# Not the workspace's lints: calling a kernel is unsafe, and this crate is where it happens.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
disallowed_types = "deny"
