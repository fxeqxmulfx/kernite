[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

# The first namespace of the GPU kernels' names in PTX, which is the directory's name
# otherwise: a clone keeps them, wherever it is.
[workspace.metadata.kernite]
name = "kernite"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/fxeqxmulfx/kgen"
keywords = ["gpu", "cuda", "ptx", "x86", "assembly"]
categories = ["compilers", "hardware-support"]

# The dependency rule, innermost first. `crates/kernite/tests/architecture.rs` checks every
# manifest against it. crates.io takes a path dependency with its version, the workspace's.
[workspace.dependencies]
kernite-core = { path = "crates/core", version = "0.1.0" }
kernite-lang = { path = "crates/lang", version = "0.1.0" }
kernite-compile = { path = "crates/compile", version = "0.1.0" }
kernite-build = { path = "crates/build", version = "0.1.0" }
kernite-x86 = { path = "crates/x86", version = "0.1.0" }
kernite-ptx = { path = "crates/ptx", version = "0.1.0" }
kernite = { path = "crates/kernite", version = "0.1.0" }
kernite-macros = { path = "crates/macros", version = "0.1.0" }
kernite-cuda = { path = "crates/cuda", version = "0.1.0" }
kernite-cpu = { path = "crates/cpu", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Iteration order must never reach the output: same program, same bytes.
disallowed_types = "deny"

[profile.release]
codegen-units = 1
