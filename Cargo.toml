[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

# The first namespace of the GPU kernels' names in PTX, which is the directory's name
# otherwise: a clone keeps them, wherever it is.
[workspace.metadata.kernite]
name = "kernite"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# The dependency rule, innermost first. `crates/kernite/tests/architecture.rs` checks every
# manifest against it.
[workspace.dependencies]
kernite-core = { path = "crates/core" }
kernite-lang = { path = "crates/lang" }
kernite-compile = { path = "crates/compile" }
kernite-build = { path = "crates/build" }
kernite-x86 = { path = "crates/x86" }
kernite-ptx = { path = "crates/ptx" }
kernite = { path = "crates/kernite" }
kernite-macros = { path = "crates/macros" }
kernite-cuda = { path = "crates/cuda" }
kernite-cpu = { path = "crates/cpu" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Iteration order must never reach the output: same program, same bytes.
disallowed_types = "deny"

[profile.release]
codegen-units = 1
