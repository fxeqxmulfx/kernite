[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

# The first namespace of the GPU kernels' names in PTX, which is the directory's name
# otherwise: a clone keeps them, wherever it is.
[workspace.metadata.kgen]
name = "kgen"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# The dependency rule, innermost first. `crates/kgen/tests/architecture.rs` checks every
# manifest against it.
[workspace.dependencies]
kgen-core = { path = "crates/core" }
kgen-lang = { path = "crates/lang" }
kgen-compile = { path = "crates/compile" }
kgen-build = { path = "crates/build" }
kgen-x86 = { path = "crates/x86" }
kgen-ptx = { path = "crates/ptx" }
kgen = { path = "crates/kgen" }
kgen-macros = { path = "crates/macros" }
kgen-cuda = { path = "crates/cuda" }
kgen-cpu = { path = "crates/cpu" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Iteration order must never reach the output: same program, same bytes.
disallowed_types = "deny"

[profile.release]
codegen-units = 1
