[package]
name = "kgen-cuda"
description = "The CUDA driver, opened when a GPU is asked for: memory on it, PTX modules, and their kernels launched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not the workspace's lints: the driver is C, reached only through `unsafe`, and this crate is
# where that happens. Each `unsafe` block says why it holds.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
disallowed_types = "deny"
undocumented_unsafe_blocks = "warn"
